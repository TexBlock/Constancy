plugins {
	id 'team.cagayakegirls.scripts'
	id 'dev.architectury.loom'
	id 'maven-publish'
}

version = project.mod_version + '+' + project.minecraft_version + '.forge' + getExtraBuildMetadata()
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

static String getExtraBuildMetadata() {
	String buildNumber = System.getenv('GITHUB_RUN_NUMBER')
	if (buildNumber != null) {
		return ".build.${buildNumber}"
	}
	return ''
}

repositories {
	maven {
		name 'TerraformersMC'
		url 'https://maven.terraformersmc.com'
	}
	maven {
		name 'Modrinth'
		url 'https://api.modrinth.com/maven'
	}
	maven {
		name 'Shedaniel'
		url 'https://maven.shedaniel.me'
	}

	maven {
		url "https://maven.su5ed.dev/releases"
	}
}

loom {
	forge {
		mixinConfig("continuity.mixins.json")
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

	modApi(include(forgifiedFabricApi.module("fabric-api-base", project.fabric_version, true)))
	modApi(include(forgifiedFabricApi.module("fabric-renderer-api-v1", project.fabric_version, true)))
	modApi(include(forgifiedFabricApi.module("fabric-renderer-indigo", project.fabric_version, true)))

	modCompileOnly forgifiedFabricApi.module("fabric-block-view-api-v2", project.fabric_version, true)

	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
	implementation(include("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"))
}

processResources {
	inputs.property 'version', project.version

	filesMatching("META-INF/mods.toml") {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
